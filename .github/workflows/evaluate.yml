name: Retrieval evaluation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the embedding and reranking models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-minilm-v1

      - name: Rebuild the chunks from the source documents
        run: python src/extract_chunks.py

      - name: Build the search index
        run: python src/build_index.py

      - name: Evaluate retrieval and enforce the thresholds
        env:
          ANONYMIZED_TELEMETRY: "False"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python eval/evaluate.py --k 5 --mode rerank \
            --min-hit-rate 0.78\
            --min-mrr 0.65 \
            --min-refusal-rate 1.0
